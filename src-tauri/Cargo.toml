[package]
name = "app"
version = "1.0.322"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Fuer den "Найти автоматически"-Knopf (Client-Ordner-Suche): Prozessliste (laufende prime.exe
# finden) und Registry-Zugriff (Uninstall-Schluessel fuer den Launcher finden) - beides braucht
# echten nativen Zugriff, den kein JS-Plugin bietet, darum eigene #[tauri::command]s (siehe
# src/lib.rs).
sysinfo = "0.32"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
